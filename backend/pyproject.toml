[project]
name = "backend"
version = "0.1.0"
description = "API da NISE (FastAPI)"
readme = "README.md"
authors = [
    { name = "Ycaro Sales", email = "ycaro.sales@edge.ufal.br" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Além do padrão (E e F), as regras abaixo. Explicação em docs/ferramentas.md.
select = [
    "E",     # pycodestyle (erros)
    "W",     # pycodestyle (avisos)
    "F",     # pyflakes
    "I",     # ordem dos imports
    "B",     # flake8-bugbear: armadilhas comuns
    "C4",    # comprehensions mais simples
    "UP",    # sintaxe moderna para a versão do Python
    "ASYNC", # chamadas que travam dentro de código assíncrono
    "T20",   # sem print: saída vai por logging, sem dados pessoais
]
ignore = [
    "E501", # tamanho da linha fica com o ruff format
    "B008", # Depends(...) nos parâmetros é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Scripts de linha de comando mostram o resultado no terminal de quem roda.
# Mesmo aqui: nada de nome, e-mail, telefone ou data de nascimento.
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# Testes `async def` rodam sem precisar do decorador @pytest.mark.asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Cobertura só do código do app (sem os testes e os scripts). Sem meta mínima:
# o relatório serve para achar o que ficou sem teste, não para barrar o PR.
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
