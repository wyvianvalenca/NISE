services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nise}
      POSTGRES_DB: ${POSTGRES_DB:-nise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nise -d nise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
